---
name: 'Golang library jobs'
run-name: 'Golang library jobs'

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-versions:
        description: 'JSON array of Go versions for the lint/test matrix'
        type: string
        default: '["1.25.12", "1.26.5"]'
      go-sec-version:
        description: 'Single Go version used for the go_sec job'
        type: string
        default: '1.26.5'
    secrets:
      DOTFILES_GITHUB_TOKEN:
        required: true

jobs:
  code-quality:
    name: 'go ${{ matrix.go-version }} / ${{ matrix.gomake-target }}'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        go-version: ${{ fromJSON(inputs.go-versions) }}
        gomake-target: ['lint', 'go_test']
        include:
          - go-version: '${{ inputs.go-sec-version }}'
            gomake-target: 'go_sec'

    steps:
      - uses: actions/checkout@v7

      - uses: agurinov/pipelines/.github/actions/setup-dotfiles@main
        with:
          token: ${{ secrets.DOTFILES_GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - run: make --include-dir=~/.make --no-print-directory toolset-ci
        working-directory: .dotfiles/golang
        env:
          GO: /opt/hostedtoolcache/go/${{ matrix.go-version }}/x64/bin/go
          GO_VERSION: ${{ matrix.go-version }}
          BINDIR: ${HOME}/go/bin

      - run: make --include-dir=~/.make --no-print-directory -f ~/.make/golang.mk ${{ matrix.gomake-target }}
...
