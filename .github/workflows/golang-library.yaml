---
name: 'Golang library jobs'
run-name: 'Golang library jobs'

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-versions:
        description: 'JSON array of Go versions for the lint/test matrix'
        type: string
        default: '["1.25.14", "1.26.10", "1.27.3"]'
      go-sec-version:
        description: 'Single Go version used for the go_sec job'
        type: string
        default: '1.27.3'

jobs:
  code-quality:
    name: 'go ${{ matrix.go-version }} / ${{ matrix.gomake-target }}'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        go-version: ${{ fromJSON(inputs.go-versions) }}
        gomake-target: ['lint', 'go_test']
        include:
          - gomake-target: 'lint'
            go-tools: 'github.com/golangci/golangci-lint/cmd/golangci-lint@latest'
          - gomake-target: 'go_sec'
            go-version: '${{ inputs.go-sec-version }}'
            go-tools: 'golang.org/x/vuln/cmd/govulncheck@latest'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      # Tools are cached per Go version (they must be built with >= target Go)
      # and per ISO week, so @latest is refreshed weekly.
      - id: go-tools-key
        if: ${{ matrix.go-tools }}
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

      - id: go-tools-cache
        if: ${{ matrix.go-tools }}
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: >-
            go-tools-${{ runner.os }}-${{ runner.arch }}-go${{ matrix.go-version }}-${{ matrix.gomake-target }}-${{ steps.go-tools-key.outputs.week }}

      - if: ${{ matrix.go-tools && steps.go-tools-cache.outputs.cache-hit != 'true' }}
        run: |
          for tool in ${GO_TOOLS}; do
            go install "${tool}"
          done
        env:
          GO_TOOLS: ${{ matrix.go-tools }}

      - run: make --no-print-directory ${{ matrix.gomake-target }}
...
