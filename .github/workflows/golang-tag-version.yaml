---
name: 'Golang tag version'
run-name: 'Golang tag version'

on:
  workflow_call:

jobs:
  tag-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fetch_all_tags: true
...
